[Xiao_S3]
extends = esp32_base
board = seeed_xiao_esp32s3
board_check = true
board_build.mcu = esp32s3
build_flags = ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/xiao_s3
  -UENV_INCLUDE_GPS
  -D SEEED_XIAO_S3
  -D P_LORA_DIO_1=3    ; IRQ
  -D P_LORA_NSS=1      ; CS
  -D P_LORA_RESET=39   ; RST
  -D P_LORA_BUSY=2     ; BUSY
  -D P_LORA_SCLK=7     ; SCK
  -D P_LORA_MISO=8     ; MISO
  -D P_LORA_MOSI=9     ; MOSI
  -D PIN_USER_BTN=21 
  -D PIN_STATUS_LED=48
  -D PIN_BOARD_SDA=D4
  -D PIN_BOARD_SCL=D5
  -D SX126X_RXEN=4     ; RXEN
  -D SX126X_TXEN=RADIOLIB_NC
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D USE_SX1268
  -D RADIO_CLASS=CustomSX1268
  -D WRAPPER_CLASS=CustomSX1268Wrapper
  -D LORA_TX_POWER=-9
  -D SX126X_RX_BOOSTED_GAIN=0
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/xiao_s3>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}

[env:Xiao_S3_repeater]
extends = Xiao_S3
build_src_filter = ${Xiao_S3.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${Xiao_S3.build_flags}
  -D ADVERT_NAME='"Xiao S3 Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D MESH_PACKET_LOGGING=1
  -D MESH_DEBUG=1
lib_deps =
  ${Xiao_S3.lib_deps}
  ${esp32_ota.lib_deps}

[env:Xiao_S3_gateway]
extends = Xiao_S3
build_src_filter = ${Xiao_S3.build_src_filter}
  +<../examples/gateway/*.cpp>
build_flags =
  ${Xiao_S3.build_flags}
  -D ADVERT_NAME='"Xiao S3 Repeater"'
